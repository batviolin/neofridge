<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeoFridge Smart Control Panel</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #00c6ff, #0072ff);
  color: #fff;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 60px;
}

.panel {
  background: rgba(255,255,255,0.12);
  border-radius: 25px;
  box-shadow: 0 0 35px rgba(0,0,0,0.35);
  backdrop-filter: blur(20px);
  width: 90%;
  max-width: 900px;
  padding: 50px 40px 40px 40px;
  margin-bottom: 60px;
}

h1 {
  font-size: 2.5em;
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  color: #dff;
  text-align: center;
  margin-bottom: 40px;
}

.temp-control, .inventory {
  background: rgba(255,255,255,0.15);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 30px;
}

.temp-display {
  font-size: 3em;
  font-weight: 600;
  margin: 0 15px;
}

.temp-buttons button {
  background: #00c6ff;
  border: none;
  color: #fff;
  padding: 12px 20px;
  font-size: 1.2em;
  border-radius: 8px;
  margin: 0 5px;
  cursor: pointer;
}

.inventory input {
  padding: 12px;
  border: none;
  border-radius: 8px;
  width: 65%;
  margin-right: 10px;
}

.inventory button {
  background: #00c6ff;
  border: none;
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
}

ul {
  list-style: none;
  padding: 0;
  margin-top: 20px;
}

li {
  background: rgba(255,255,255,0.2);
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
}

.remove-btn {
  background: #ff4d4d;
  border: none;
  padding: 6px 10px;
  color: white;
  cursor: pointer;
}

.controls {
  text-align: center;
  margin-top: 30px;
}

.controls button {
  margin: 5px;
  padding: 12px 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="panel">
  <h1>NeoFridge Control Panel</h1>
  <p class="subtitle">Manage your fridge temperature and inventory effortlessly.</p>

  <div class="temp-control">
    <h2>Temperature</h2>
    <div class="temp-buttons">
      <button id="decreaseTemp">−</button>
      <span id="temperature">4°C</span>
      <button id="increaseTemp">+</button>
    </div>
  </div>

  <div class="inventory">
    <h2>Inventory</h2>
    <input type="text" id="itemInput" placeholder="Add item">
    <button id="addItem">Add</button>
    <ul id="itemList"></ul>
  </div>

  <div class="controls">
    <button id="speakAll">🔊 Status</button>
    <button id="toggleVoice">🎤 Start Listening</button>
  </div>
</div>

<script>
let temperature = 4;

const tempDisplay = document.getElementById('temperature');
const decreaseTemp = document.getElementById('decreaseTemp');
const increaseTemp = document.getElementById('increaseTemp');
const itemInput = document.getElementById('itemInput');
const addItem = document.getElementById('addItem');
const itemList = document.getElementById('itemList');
const speakBtn = document.getElementById('speakAll');
const toggleVoiceBtn = document.getElementById('toggleVoice');

let listening = false;
let recognition;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function updateTemp() {
  tempDisplay.textContent = temperature + "°C";
}

function speak(text) {
  const speech = new SpeechSynthesisUtterance(text);
  speechSynthesis.speak(speech);
}

// temperature buttons
increaseTemp.onclick = () => {
  if (temperature < 10) {
    temperature++;
    updateTemp();
    speak("Temperature increased");
  }
};

decreaseTemp.onclick = () => {
  if (temperature > -5) {
    temperature--;
    updateTemp();
    speak("Temperature decreased");
  }
};

// add item
addItem.onclick = () => {
  let item = itemInput.value.trim();
  if (!item) return;

  let li = document.createElement("li");
  li.innerHTML = item + ' <button class="remove-btn">X</button>';

  li.querySelector("button").onclick = () => li.remove();

  itemList.appendChild(li);
  itemInput.value = "";
};

// speak status
speakBtn.onclick = () => {
  let items = [...itemList.children].map(li => li.textContent.replace("X",""));
  speak("Temperature is " + temperature + " degrees. Items: " + (items.join(", ") || "none"));
};

// voice recognition
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.continuous = true;

  recognition.onresult = (e) => {
    let cmd = e.results[e.results.length-1][0].transcript.toLowerCase();

    if (cmd.includes("increase")) increaseTemp.click();
    else if (cmd.includes("decrease")) decreaseTemp.click();
    else if (cmd.includes("add")) {
      let item = cmd.replace("add", "").trim();
      itemInput.value = item;
      addItem.click();
    }
    else if (cmd.includes("status")) speakBtn.click();
  };
}

// toggle voice
toggleVoiceBtn.onclick = () => {
  if (!SpeechRecognition) {
    alert("Voice not supported");
    return;
  }

  if (!listening) {
    recognition.start();
    listening = true;
    toggleVoiceBtn.textContent = "Stop Listening";
  } else {
    recognition.stop();
    listening = false;
    toggleVoiceBtn.textContent = "Start Listening";
  }
};
</script>

</body>
</html>
